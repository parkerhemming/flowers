<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flower catalog</title>
<style>
  html,body{margin:0;background:#0b0a0d;color:#e7dde1;font:13px/1.5 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  main{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
  h1{font-size:15px;font-weight:600;color:#ffd6dc;margin:0 0 4px}
  p.sub{margin:0 0 22px;color:#9d9096}
  #grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:760px}
  .tile{margin:0;border:1px dashed rgba(255,214,220,.28);border-radius:3px;padding:10px 10px 12px;min-width:0}
  @media (max-width:520px){main{padding:20px 10px 48px}#grid{gap:8px}.tile{padding:6px 6px 8px}.mean{font-size:11px}}
  .tile canvas{display:block;width:100%}
  figcaption{margin-top:8px}
  .num{color:#9d9096}
  .mean{color:#9d9096;font-size:12px}
</style>
<main>
  <h1>flower catalog</h1>
  <p class="sub">each flower as a small swaying bunch, rendered with the real ASCII engine. tell me the numbers you approve.</p>
  <div id="grid"></div>
</main>
<script>
// Flower catalog: each candidate flower drawn as a small swaying bunch through the same
// vector -> ASCII pipeline as the bouquet page, for review before it joins the generator.
const q = new URLSearchParams(location.search), still = q.has('still');
let P = 1, s = null;                       // bloom amount; current sample canvas context
const RAMP = " .`',:;~-=+*<>!?ox%&#@";
const EDGES = ['|', '\\', '-', '/'];
const EDGE = .9;
const TAU = Math.PI * 2;
const ease = t => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);
const clamp01 = t => Math.max(0, Math.min(1, t));
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- flowers shared with the bouquet page ----------
function lin(x0, y0, x1, y1, stops) {
  const g = s.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  return g;
}
function rad(x0, y0, r0, r1, stops) {
  const g = s.createRadialGradient(x0, y0, r0, x0, y0, r1);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  return g;
}
function rose(cx, cy, r, rot, tilt = 0, sq = 1, open = 1) {
  const p = P * open, e = ease(p * 1.15);
  seed = 1 + Math.floor(rot * 100003) % 2147483646;   // own stream: petals never reshuffle between frames
  r *= 0.35 + 0.65 * e;
  s.save(); s.translate(cx, cy); s.rotate(tilt); s.scale(1, sq);
  // green sepals peeking out from behind the head
  for (let i = 0; i < 5; i++) {
    s.save(); s.rotate(i * TAU / 5 + rot + rnd() * .4);
    s.beginPath(); s.moveTo(-r * .18, 0); s.quadraticCurveTo(-r * .1, -r * .9, 0, -r * (1.05 + rnd() * .25)); s.quadraticCurveTo(r * .1, -r * .9, r * .18, 0);
    s.fillStyle = lin(0, 0, 0, -r * 1.2, [[0, '#1d4a26'], [1, '#5fae55']]); s.fill();
    s.restore();
  }
  s.rotate(rot);
  // Petals are real petal shapes, not ellipses: narrow base, uneven shoulders, and a
  // top edge that is either notched or rolled back to a point. Sizes, spacing and
  // angles are jittered so the outline is ragged rather than a circle. Petals are
  // separated by a thin deep-crimson crease, not a black outline.
  const layers = [
    { n: 5, d: .66, rx: .46, ry: .44, j: .5, a: clamp01((p - .6) / .4), base: '#3a0510', mid: '#b31d36', edge: '#ff7f90' },   // loose guard petals
    { n: 7, d: .46, rx: .5, ry: .42, j: .3, a: clamp01((p - .45) / .4), base: '#30040d', mid: '#a5172e', edge: '#ff6f84' },
    { n: 6, d: .31, rx: .44, ry: .35, j: .2, a: clamp01((p - .25) / .4), base: '#28030b', mid: '#931428', edge: '#f2566d' },
    { n: 5, d: .19, rx: .34, ry: .28, j: .12, a: clamp01((p - .05) / .4), base: '#200208', mid: '#7e0d1e', edge: '#e03a55' },
  ];
  layers.forEach((L, li) => {
    s.globalAlpha = L.a;
    for (let i = 0; i < L.n; i++) {
      const ang = i * TAU / L.n + li * .55 + (rnd() - .5) * L.j * 1.6;
      const dist = L.d * (1 + (rnd() - .5) * L.j * .6), size = 1 + (rnd() - .5) * L.j;
      const rx = L.rx * r * size * (.9 + rnd() * .25), ry = L.ry * r * size, sk = (rnd() - .5) * .5;
      const notch = rnd() < .55 ? .08 + rnd() * .1 : -(.06 + rnd() * .1);   // >0 notched, <0 rolled-back point
      const gap = rnd() < .25;                                                 // always consumed, so the stream stays aligned
      if ((li === 0 && gap) || !L.a) continue;                                 // gaps in the guard petals
      s.save();
      s.rotate(ang);
      s.translate(0, -dist * r * (0.6 + 0.4 * L.a));
      const lw = rx * (1 + sk), rw = rx * (1 - sk), top = -ry * (1 - notch);
      s.beginPath();
      s.moveTo(-rx * .2, ry);
      s.bezierCurveTo(-lw * 1.15, ry * .55, -lw * 1.1, -ry * .55, -lw * .4, -ry * .95);
      s.quadraticCurveTo(-lw * .12, -ry * 1.05, 0, top);
      s.quadraticCurveTo(rw * .12, -ry * 1.05, rw * .4, -ry * .95);
      s.bezierCurveTo(rw * 1.1, -ry * .55, rw * 1.15, ry * .55, rx * .2, ry);
      s.closePath();
      s.fillStyle = lin(0, ry, 0, -ry, [[0, L.base], [.55, L.mid], [1, L.edge]]);
      s.fill();
      s.lineWidth = r * .03; s.strokeStyle = '#4a0612'; s.stroke();
      // rim light only along the outer lip, where the petal curls back
      s.beginPath();
      s.moveTo(-lw * .95, -ry * .5);
      s.quadraticCurveTo(-lw * .7, -ry * .92, -lw * .35, -ry * .93);
      s.quadraticCurveTo(-lw * .1, -ry, 0, top + ry * .06);
      s.quadraticCurveTo(rw * .1, -ry, rw * .35, -ry * .93);
      s.quadraticCurveTo(rw * .7, -ry * .92, rw * .95, -ry * .5);
      s.lineWidth = r * .045; s.strokeStyle = '#ff9aa8'; s.stroke();
      // a rolled-back tip shows a sliver of the paler underside
      if (notch < 0) {
        s.beginPath(); s.ellipse(0, top + ry * .14, rx * .28, ry * .1, 0, 0, TAU);
        s.fillStyle = '#ffc2cb'; s.fill();
      }
      s.restore();
    }
  });
  s.globalAlpha = 1;
  // tight spiral heart
  const hr = r * .24;
  s.fillStyle = rad(0, 0, 0, hr, [[0, '#2a0208'], [1, '#7a0c1d']]);
  s.beginPath(); s.arc(0, 0, hr, 0, TAU); s.fill();
  s.beginPath();
  for (let t = 0; t < 5.5 * Math.PI; t += .08) {
    const rr = hr * (1 - t / (6 * Math.PI));
    s.lineTo(Math.cos(t + rot) * rr, Math.sin(t + rot) * rr * .9);
  }
  s.lineWidth = r * .07; s.strokeStyle = '#ff7a8e'; s.stroke();
  s.restore();
}
function dokRakHead(cx, cy, r, rot) {
  const e = ease((P - .15) * 1.4);
  if (e <= 0) return;
  r *= e;
  s.save(); s.translate(cx, cy); s.rotate(rot);
  for (let i = 0; i < 5; i++) {
    s.save(); s.rotate(i * TAU / 5);
    s.beginPath(); s.moveTo(0, 0);
    s.quadraticCurveTo(r * .5, -r * .45, 0, -r);
    s.quadraticCurveTo(-r * .5, -r * .45, 0, 0);
    s.fillStyle = lin(0, 0, 0, -r, [[0, '#7d66b8'], [.5, '#c9bcef'], [1, '#f5f1ff']]);
    s.fill(); s.lineWidth = r * .06; s.strokeStyle = '#2e2350'; s.stroke();
    s.restore();
  }
  // the "crown": five waxy lobes around a dark centre
  for (let i = 0; i < 5; i++) {
    s.save(); s.rotate(i * TAU / 5 + Math.PI / 5);
    s.beginPath(); s.ellipse(0, -r * .27, r * .12, r * .2, 0, 0, TAU);
    s.fillStyle = lin(0, -r * .1, 0, -r * .45, [[0, '#d7cdf7'], [1, '#ffffff']]); s.fill();
    s.lineWidth = r * .04; s.strokeStyle = '#5b4796'; s.stroke();
    s.restore();
  }
  s.fillStyle = '#3d2d6a'; s.beginPath(); s.arc(0, 0, r * .12, 0, TAU); s.fill();
  s.restore();
}
function dokRakBud(cx, cy, r) {
  if (P <= 0) return;
  r *= ease(P * 1.4);
  s.save(); s.translate(cx, cy);
  s.beginPath(); s.ellipse(0, 0, r * .55, r * .7, 0, 0, TAU);
  s.fillStyle = rad(-r * .2, -r * .3, 0, r, [[0, '#f3eeff'], [.6, '#c2b4ea'], [1, '#6f5aa6']]); s.fill();
  s.strokeStyle = '#4b3a7a'; s.lineWidth = r * .07;
  for (let k = -1; k <= 1; k++) { s.beginPath(); s.moveTo(0, -r * .7); s.quadraticCurveTo(k * r * .5, 0, 0, r * .7); s.stroke(); }
  s.restore();
}
function orchid(cx, cy, r, rot) {
  const e = ease((P - .25) * 1.5);
  if (e <= 0) return;
  r *= e;
  s.save(); s.translate(cx, cy); s.rotate(rot);
  const petal = (ang, rx, ry, d) => {
    s.save(); s.rotate(ang);
    s.beginPath(); s.ellipse(0, -d, rx, ry, 0, 0, TAU);
    s.fillStyle = lin(0, 0, 0, -d - ry, [[0, '#fbe6f8'], [.35, '#e48fdc'], [.7, '#b23aa8'], [1, '#6a1466']]);
    s.fill(); s.lineWidth = r * .045; s.strokeStyle = '#2a0628'; s.stroke();
    s.strokeStyle = 'rgba(90,15,87,.55)'; s.lineWidth = r * .025; // veins
    for (const k of [-.45, 0, .45]) { s.beginPath(); s.moveTo(0, -d + ry * .8); s.quadraticCurveTo(k * rx, -d, k * rx * .5, -d - ry * .85); s.stroke(); }
    s.restore();
  };
  petal(0, r * .17, r * .44, r * .48);           // dorsal sepal
  petal(2.25, r * .17, r * .42, r * .46);        // lateral sepals
  petal(-2.25, r * .17, r * .42, r * .46);
  petal(1.2, r * .3, r * .48, r * .5);           // broad petals
  petal(-1.2, r * .3, r * .48, r * .5);
  // lip (labellum)
  s.beginPath(); s.moveTo(-r * .14, 0);
  s.bezierCurveTo(-r * .45, r * .2, -r * .35, r * .62, 0, r * .66);
  s.bezierCurveTo(r * .35, r * .62, r * .45, r * .2, r * .14, 0); s.closePath();
  s.fillStyle = lin(0, 0, 0, r * .66, [[0, '#3c0838'], [.6, '#7e1a78'], [1, '#b23aa8']]); s.fill();
  s.lineWidth = r * .04; s.strokeStyle = '#1a0318'; s.stroke();
  s.beginPath(); s.ellipse(0, r * .14, r * .07, r * .13, 0, 0, TAU); s.fillStyle = '#fff4fd'; s.fill(); // column
  s.restore();
}
function leaf(x0, y0, ang, len, w, dark = 0) {
  const e = ease((P - .05) * 1.6); if (e <= 0) return;
  len *= e;
  s.save(); s.translate(x0, y0); s.rotate(ang);
  s.beginPath(); s.moveTo(0, 0); s.quadraticCurveTo(w, -len * .45, 0, -len); s.quadraticCurveTo(-w, -len * .45, 0, 0);
  s.fillStyle = lin(0, 0, 0, -len, [[0, '#173d22'], [.5, '#3f8f4a'], [1, '#86cc72']]); s.fill();
  s.beginPath(); s.moveTo(0, 0); s.quadraticCurveTo(-w, -len * .45, 0, -len); s.quadraticCurveTo(0, -len * .45, 0, 0);
  s.fillStyle = 'rgba(0,0,0,.35)'; s.fill(); // shaded half
  s.lineWidth = w * .12; s.strokeStyle = '#0d2414';
  s.beginPath(); s.moveTo(0, 0); s.quadraticCurveTo(w, -len * .45, 0, -len); s.quadraticCurveTo(-w, -len * .45, 0, 0); s.stroke();
  s.strokeStyle = '#9bdc84'; s.lineWidth = w * .08; s.beginPath(); s.moveTo(0, 0); s.lineTo(0, -len * .96); s.stroke();
  for (let k = .2; k < .9; k += .14) { // side veins
    s.beginPath(); s.moveTo(0, -len * k); s.lineTo(w * .6, -len * (k + .08)); s.moveTo(0, -len * k); s.lineTo(-w * .6, -len * (k + .08));
    s.strokeStyle = 'rgba(155,220,132,.45)'; s.lineWidth = w * .05; s.stroke();
  }
  if (dark > 0) {                                      // depth: leaves further back sit in shadow
    s.beginPath(); s.moveTo(0, 0); s.quadraticCurveTo(w, -len * .45, 0, -len); s.quadraticCurveTo(-w, -len * .45, 0, 0);
    s.fillStyle = `rgba(4,12,6,${dark})`; s.fill();
  }
  s.restore();
}
function shade(hex, f) {                               // f > 0 lightens toward white, f < 0 darkens toward black
  const n = parseInt(hex.slice(1), 16), m = v => Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f));
  return `rgb(${m(n >> 16)},${m(n >> 8 & 255)},${m(n & 255)})`;
}

// ---------- new flowers ----------
// All in world units, drawn into the current sample context `s`, same conventions as rose().

function tulip(cx, cy, r, rot, [base, mid, edge]) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  const h = r * 1.7, w = r * .78;
  const cup = () => {
    s.beginPath(); s.moveTo(0, h * .45);
    s.bezierCurveTo(-w * 1.15, h * .38, -w * 1.1, -h * .22, -w * .78, -h * .5);   // left side up to the left tip
    s.quadraticCurveTo(-w * .5, -h * .36, -w * .3, -h * .34);
    s.quadraticCurveTo(-w * .12, -h * .5, 0, -h * .62);                           // centre tip
    s.quadraticCurveTo(w * .12, -h * .5, w * .3, -h * .34);
    s.quadraticCurveTo(w * .5, -h * .36, w * .78, -h * .5);                        // right tip
    s.bezierCurveTo(w * 1.1, -h * .22, w * 1.15, h * .38, 0, h * .45);
  };
  cup(); s.fillStyle = lin(-w, 0, w, 0, [[0, base], [.3, mid], [.55, edge], [.8, mid], [1, base]]); s.fill();
  cup(); s.fillStyle = lin(0, h * .45, 0, -h * .6, [[0, 'rgba(0,0,0,.5)'], [.55, 'rgba(0,0,0,0)']]); s.fill();   // shade toward the base
  s.lineWidth = r * .06; s.strokeStyle = shade(base, -.45);
  for (const sd of [-1, 1]) { s.beginPath(); s.moveTo(sd * w * .1, h * .4); s.quadraticCurveTo(sd * w * .55, 0, sd * w * .3, -h * .34); s.stroke(); }   // petal creases
  cup(); s.lineWidth = r * .045; s.strokeStyle = shade(base, -.55); s.stroke();
  s.beginPath(); s.moveTo(-w * .7, -h * .44); s.quadraticCurveTo(-w * .4, -h * .3, -w * .3, -h * .34);
  s.lineWidth = r * .05; s.strokeStyle = shade(edge, .35); s.stroke();             // light on the left lip
  s.restore();
}

function sunflower(cx, cy, r, rot) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  for (const [n, len, off, k] of [[21, 1, 0, -.15], [21, .86, .15, .05]]) {
    for (let i = 0; i < n; i++) {
      s.save(); s.rotate(i * TAU / n + off + (rnd() - .5) * .08);
      const ry = r * .34 * len * (.92 + rnd() * .16), d = r * .42 + ry;
      s.beginPath(); s.ellipse(0, -d, r * .12, ry, 0, 0, TAU);
      s.fillStyle = lin(0, -r * .42, 0, -d - ry, [[0, shade('#b8730a', k)], [.5, shade('#ffc22e', k)], [1, shade('#ffe680', k)]]);
      s.fill(); s.lineWidth = r * .03; s.strokeStyle = '#4a2f04'; s.stroke();
      s.restore();
    }
  }
  s.fillStyle = rad(0, 0, 0, r * .44, [[0, '#1f0e03'], [.6, '#4e2c0e'], [1, '#7a4a18']]);
  s.beginPath(); s.arc(0, 0, r * .44, 0, TAU); s.fill();
  for (let i = 0; i < 140; i++) {                            // seeds in a sunflower spiral
    const a = i * 2.39996, rr = r * .42 * Math.sqrt(i / 140);
    s.beginPath(); s.arc(Math.cos(a) * rr, Math.sin(a) * rr, r * .022, 0, TAU);
    s.fillStyle = i % 2 ? '#b07a28' : '#160902'; s.fill();
  }
  s.beginPath(); s.arc(0, 0, r * .44, 0, TAU); s.lineWidth = r * .03; s.strokeStyle = '#d9a030'; s.stroke();
  s.restore();
}

function lavender(x, yTop, len, rot) {
  s.save(); s.translate(x, yTop); s.rotate(rot);
  const n = 15;
  for (let k = n - 1; k >= 0; k--) {
    const t = k / (n - 1), y = t * len * .6, rk = .55 + t * 1.15;
    for (const side of [-1, 1]) {
      s.beginPath(); s.ellipse(side * rk * .55, y + (side > 0 ? rk * .4 : 0), rk * .55, rk * .85, side * .35, 0, TAU);
      s.fillStyle = rad(side * rk * .4, y - rk * .3, 0, rk * 1.1, [[0, '#d9c8ff'], [.5, '#9b78e6'], [1, '#4a2a8a']]);
      s.fill();
    }
    s.beginPath(); s.ellipse(0, y - rk * .2, rk * .45, rk * .7, 0, 0, TAU); s.fillStyle = shade('#8a66d6', -.1 * t); s.fill();
  }
  s.restore();
}

function daisy(cx, cy, r, rot) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  const n = 18;
  for (let i = 0; i < n; i++) {
    s.save(); s.rotate(i * TAU / n + (rnd() - .5) * .1);
    const ry = r * .4 * (.9 + rnd() * .2);
    s.beginPath(); s.ellipse(0, -r * .26 - ry, r * .11, ry, 0, 0, TAU);
    s.fillStyle = lin(0, -r * .26, 0, -r * .26 - 2 * ry, [[0, '#bdb6a6'], [.4, '#f4f1ea'], [1, '#ffffff']]);
    s.fill(); s.lineWidth = r * .03; s.strokeStyle = '#5e594f'; s.stroke();
    s.restore();
  }
  s.fillStyle = rad(-r * .06, -r * .06, 0, r * .27, [[0, '#ffe680'], [.6, '#f2b411'], [1, '#8a5a00']]);
  s.beginPath(); s.arc(0, 0, r * .27, 0, TAU); s.fill();
  for (let i = 0; i < 40; i++) { const a = i * 2.39996, rr = r * .24 * Math.sqrt(i / 40); s.beginPath(); s.arc(Math.cos(a) * rr, Math.sin(a) * rr, r * .025, 0, TAU); s.fillStyle = '#7a4c00'; s.fill(); }
  s.restore();
}

function babysSprig(x, y, r, rot) {
  for (let k = 0; k < 5; k++) {
    const a = k * 1.26 + rot, d = k ? r : 0;
    s.beginPath(); s.arc(x + Math.cos(a) * d, y + Math.sin(a) * d * .8, .55, 0, TAU); s.fillStyle = '#f4eef2'; s.fill();
  }
}

function peony(cx, cy, r, rot, [base, mid, edge]) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  for (const [L, n] of [[1, 9], [.8, 9], [.62, 8], [.45, 7], [.3, 6]]) {      // big ruffled layers, outside in
    for (let i = 0; i < n; i++) {
      s.save(); s.rotate(i * TAU / n + L * 3 + (rnd() - .5) * .5);
      const d = r * L * .5, rx = r * L * .42 * (.9 + rnd() * .25), ry = r * L * .34;
      s.beginPath();
      for (let k = 0; k <= 24; k++) {                                         // wavy outer edge
        const a = k / 24 * TAU, wob = 1 + (Math.sin(a * 5 + i) * .07) * (Math.sin(a) < 0 ? 1 : 0);
        s.lineTo(Math.cos(a) * rx * wob, -d + Math.sin(a) * ry * wob);
      }
      s.closePath();
      s.fillStyle = lin(0, -d + ry, 0, -d - ry, [[0, base], [.5, mid], [1, edge]]); s.fill();
      s.lineWidth = r * .03; s.strokeStyle = shade(base, -.45); s.stroke();
      s.restore();
    }
  }
  for (let i = 0; i < 14; i++) {                                              // crumpled heart
    const a = rnd() * TAU, dd = rnd() * r * .16;
    s.beginPath(); s.ellipse(Math.cos(a) * dd, Math.sin(a) * dd, r * .07, r * .05, a, 0, TAU);
    s.fillStyle = i % 2 ? edge : shade(mid, -.25); s.fill();
  }
  s.restore();
}

function hydrangea(cx, cy, R, [dark, mid, light]) {
  const fl = [];
  for (let i = 0; i < 46; i++) { const a = rnd() * TAU, d = Math.sqrt(rnd()) * R; fl.push([Math.cos(a) * d, Math.sin(a) * d * .85]); }
  fl.sort((a, b) => a[1] - b[1]);
  for (const [fx, fy] of fl) {
    const lit = clamp01(.55 - (fx + fy) / (2.4 * R)), c = lit > .5 ? light : lit > .25 ? mid : dark, fr = R * .15;
    s.save(); s.translate(cx + fx, cy + fy); s.rotate(fx * .3);
    for (let k = 0; k < 4; k++) { s.beginPath(); s.ellipse(0, -fr * .55, fr * .42, fr * .55, 0, 0, TAU); s.fillStyle = c; s.fill(); s.lineWidth = fr * .12; s.strokeStyle = shade(dark, -.45); s.stroke(); s.rotate(Math.PI / 2); }
    s.beginPath(); s.arc(0, 0, fr * .14, 0, TAU); s.fillStyle = shade(light, .4); s.fill();
    s.restore();
  }
}

function lily(cx, cy, r, rot) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  for (let i = 0; i < 6; i++) {
    s.save(); s.rotate(i * TAU / 6 + (i % 2 ? .25 : 0));
    const L = r * (i % 2 ? .95 : 1.05);
    s.beginPath(); s.moveTo(0, 0); s.quadraticCurveTo(r * .48, -L * .5, r * .06, -L); s.quadraticCurveTo(-r * .48, -L * .5, 0, 0);
    s.fillStyle = lin(0, 0, 0, -L, [[0, '#9c1450'], [.35, '#e0457e'], [.7, '#f7c6da'], [1, '#ffffff']]); s.fill();
    s.lineWidth = r * .03; s.strokeStyle = '#5a0f2c'; s.stroke();
    s.beginPath(); s.moveTo(0, -L * .1); s.lineTo(0, -L * .8); s.strokeStyle = 'rgba(255,255,255,.55)'; s.lineWidth = r * .03; s.stroke();
    for (let k = 0; k < 6; k++) { s.beginPath(); s.arc((rnd() - .5) * r * .14, -L * (.15 + rnd() * .35), r * .025, 0, TAU); s.fillStyle = '#6e0a32'; s.fill(); }
    s.restore();
  }
  for (let i = 0; i < 6; i++) {                                               // stamens
    const a = i * TAU / 6 + .5, ex = Math.cos(a) * r * .55, ey = Math.sin(a) * r * .55;
    s.beginPath(); s.moveTo(0, 0); s.lineTo(ex, ey); s.strokeStyle = '#c9e0a0'; s.lineWidth = r * .025; s.stroke();
    s.beginPath(); s.ellipse(ex, ey, r * .07, r * .035, a, 0, TAU); s.fillStyle = '#c4561a'; s.fill();
  }
  s.restore();
}

function carnation(cx, cy, r, rot, [base, mid, edge]) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  for (const [L, teeth] of [[1, 34], [.78, 28], [.56, 22], [.34, 16]]) {      // frilly toothed layers
    s.beginPath();
    for (let k = 0; k <= teeth * 2; k++) { const a = k / (teeth * 2) * TAU, rr = r * L * (k % 2 ? .86 : 1) * (.94 + rnd() * .1); s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * .9); }
    s.closePath();
    s.fillStyle = rad(0, 0, 0, r * L, [[0, base], [.6, mid], [1, edge]]); s.fill();
    s.lineWidth = r * .03; s.strokeStyle = shade(base, -.4); s.stroke();
  }
  s.restore();
}

function gerbera(cx, cy, r, rot, [deep, bright, tip]) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  for (const [n, len, off, k] of [[24, 1, 0, -.1], [24, .8, .13, .1]]) {
    for (let i = 0; i < n; i++) {
      s.save(); s.rotate(i * TAU / n + off);
      const ry = r * .33 * len, d = r * .3 + ry;
      s.beginPath(); s.ellipse(0, -d, r * .085, ry, 0, 0, TAU);
      s.fillStyle = lin(0, -r * .3, 0, -d - ry, [[0, shade(deep, k)], [.45, shade(bright, k)], [1, shade(tip, k)]]); s.fill();
      s.lineWidth = r * .025; s.strokeStyle = shade(deep, -.5); s.stroke();
      s.restore();
    }
  }
  s.beginPath(); s.arc(0, 0, r * .3, 0, TAU); s.fillStyle = rad(0, 0, 0, r * .3, [[0, '#1a1a08'], [.55, '#3e3a10'], [.8, '#b8a020'], [1, '#e8d050']]); s.fill();
  s.restore();
}

function ranunculus(cx, cy, r, rot, [base, mid, edge]) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  for (let k = 0; k < 10; k++) {                                              // tightly packed concentric petals
    const rr = r * (1 - k * .092), ox = Math.sin(k * 1.7) * r * .03, oy = Math.cos(k * 1.3) * r * .03;
    s.beginPath(); s.ellipse(ox, oy, rr, rr * .92, k * .4, 0, TAU);
    s.fillStyle = rad(ox, oy - rr * .3, 0, rr, [[0, edge], [.6, mid], [1, base]]); s.fill();
    s.lineWidth = r * .035; s.strokeStyle = shade(base, -.45); s.stroke();
  }
  s.beginPath(); s.arc(0, 0, r * .08, 0, TAU); s.fillStyle = '#5a8a3a'; s.fill();
  s.restore();
}

function callaLily(cx, cy, r, rot) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  s.beginPath(); s.moveTo(0, r * .9);                                         // the trumpet (spathe)
  s.bezierCurveTo(-r * .35, r * .5, -r * .55, -r * .2, -r * .5, -r * .7);
  s.quadraticCurveTo(-r * .1, -r * 1.05, r * .45, -r * 1.15);                 // curled lip
  s.quadraticCurveTo(r * .2, -r * .7, r * .38, -r * .3);
  s.bezierCurveTo(r * .45, r * .1, r * .3, r * .6, 0, r * .9);
  s.fillStyle = lin(-r * .5, 0, r * .45, 0, [[0, '#9aa890'], [.35, '#f4f2ea'], [.7, '#ffffff'], [1, '#c8cfc0']]); s.fill();
  s.fillStyle = lin(0, r * .9, 0, r * .2, [[0, 'rgba(70,120,50,.9)'], [1, 'rgba(70,120,50,0)']]); s.fill();
  s.lineWidth = r * .04; s.strokeStyle = '#5e6658'; s.stroke();
  s.beginPath(); s.moveTo(-r * .48, -r * .68); s.quadraticCurveTo(-r * .05, -r * .78, r * .38, -r * .3);   // inner throat shadow
  s.lineWidth = r * .05; s.strokeStyle = '#8c9484'; s.stroke();
  s.beginPath(); s.ellipse(-r * .02, -r * .35, r * .07, r * .32, -.15, 0, TAU); s.fillStyle = '#f2c230'; s.fill();   // spadix
  s.restore();
}

function chrysanthemum(cx, cy, r, rot, [deep, mid, tip]) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  s.beginPath(); s.arc(0, 0, r * .85, 0, TAU); s.fillStyle = rad(0, 0, 0, r * .85, [[0, tip], [.5, mid], [1, deep]]); s.fill();
  for (const L of [1, .82, .64, .46, .3]) {
    const n = Math.round(20 + L * 22);
    for (let i = 0; i < n; i++) {
      s.save(); s.rotate(i * TAU / n + L * 7);
      const len = r * L * (.85 + rnd() * .2);
      s.beginPath(); s.moveTo(0, 0); s.quadraticCurveTo(r * .05, -len * .5, 0, -len); s.quadraticCurveTo(-r * .05, -len * .5, 0, 0);
      s.fillStyle = lin(0, 0, 0, -len, [[0, deep], [.6, mid], [1, tip]]); s.fill();
      s.lineWidth = r * .02; s.strokeStyle = shade(deep, -.4); s.stroke();
      s.restore();
    }
  }
  s.restore();
}

function dahlia(cx, cy, r, rot, [base, mid, edge]) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  s.beginPath(); s.arc(0, 0, r * .9, 0, TAU); s.fillStyle = rad(0, 0, 0, r * .9, [[0, base], [.6, mid], [1, shade(base, .1)]]); s.fill();
  for (const [L, n] of [[1, 16], [.82, 16], [.64, 14], [.47, 12], [.32, 10], [.18, 8]]) {   // geometric cupped petals
    for (let i = 0; i < n; i++) {
      s.save(); s.rotate(i * TAU / n + L * 1.9);
      const len = r * L, w = r * L * .24;
      s.beginPath(); s.moveTo(0, -len * .35); s.quadraticCurveTo(w, -len * .7, 0, -len); s.quadraticCurveTo(-w, -len * .7, 0, -len * .35);
      s.fillStyle = lin(0, -len * .35, 0, -len, [[0, base], [.5, mid], [1, edge]]); s.fill();
      s.lineWidth = r * .025; s.strokeStyle = shade(base, -.5); s.stroke();
      s.beginPath(); s.moveTo(0, -len * .45); s.lineTo(0, -len * .9); s.lineWidth = r * .02; s.strokeStyle = shade(base, -.3); s.stroke();   // centre groove
      s.restore();
    }
  }
  s.beginPath(); s.arc(0, 0, r * .14, 0, TAU); s.fillStyle = shade(base, -.3); s.fill();
  s.restore();
}

function anemone(cx, cy, r, rot) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  for (let i = 0; i < 6; i++) {
    s.save(); s.rotate(i * TAU / 6 + (rnd() - .5) * .15);
    s.beginPath(); s.ellipse(0, -r * .55, r * .38, r * .5, 0, 0, TAU);
    s.fillStyle = lin(0, -r * .05, 0, -r * 1.05, [[0, '#cfcbd6'], [.4, '#f5f3f8'], [1, '#ffffff']]); s.fill();
    s.lineWidth = r * .03; s.strokeStyle = '#6a6672'; s.stroke();
    s.restore();
  }
  s.beginPath(); s.arc(0, 0, r * .27, 0, TAU); s.fillStyle = '#0d0d1a'; s.fill();
  for (let i = 0; i < 30; i++) { const a = i * 2.39996, rr = r * (.2 + .15 * (i % 3) / 2); s.beginPath(); s.arc(Math.cos(a) * rr, Math.sin(a) * rr, r * .035, 0, TAU); s.fillStyle = '#1c1c3a'; s.fill(); }
  s.beginPath(); s.arc(0, 0, r * .12, 0, TAU); s.fillStyle = '#2a2a55'; s.fill();
  s.restore();
}

function iris(cx, cy, r, rot) {
  s.save(); s.translate(cx, cy); s.rotate(rot);
  for (const a of [-2.3, 0, 2.3]) {                                           // falls: droop down and out, yellow signal
    s.save(); s.rotate(a * .5); s.scale(1, -1);
    s.beginPath(); s.moveTo(0, 0); s.bezierCurveTo(r * .45, -r * .2, r * .4, -r * .9, 0, -r * 1.05); s.bezierCurveTo(-r * .4, -r * .9, -r * .45, -r * .2, 0, 0);
    s.fillStyle = lin(0, 0, 0, -r * 1.05, [[0, '#2e1a6a'], [.5, '#5a3cc0'], [1, '#8f78ea']]); s.fill();
    s.lineWidth = r * .03; s.strokeStyle = '#1a0f40'; s.stroke();
    s.beginPath(); s.ellipse(0, -r * .35, r * .08, r * .22, 0, 0, TAU); s.fillStyle = '#f2c230'; s.fill();
    s.restore();
  }
  for (const a of [-.45, 0, .45]) {                                           // standards: upright
    s.save(); s.rotate(a);
    s.beginPath(); s.moveTo(0, 0); s.bezierCurveTo(r * .3, -r * .2, r * .25, -r * .8, 0, -r * .95); s.bezierCurveTo(-r * .25, -r * .8, -r * .3, -r * .2, 0, 0);
    s.fillStyle = lin(0, 0, 0, -r * .95, [[0, '#3a2480'], [.6, '#7a62e0'], [1, '#b6a6ff']]); s.fill();
    s.lineWidth = r * .03; s.strokeStyle = '#1a0f40'; s.stroke();
    s.restore();
  }
  s.restore();
}

function eucalyptus(x, y, len, rot) {
  s.save(); s.translate(x, y); s.rotate(rot);
  s.beginPath(); s.moveTo(0, 0); s.quadraticCurveTo(len * .08, len * .5, 0, len); s.strokeStyle = '#6b8a6a'; s.lineWidth = .4; s.stroke();
  for (let k = 0; k < 7; k++) {                                               // round silvery leaves in pairs
    const t = k / 7, yy = len * t, rr = 1.2 + t * .8;
    for (const sd of [-1, 1]) {
      s.beginPath(); s.ellipse(sd * rr * 1.15, yy, rr, rr * .85, sd * .3, 0, TAU);
      s.fillStyle = rad(sd * rr * .7, yy - rr * .3, 0, rr * 1.2, [[0, '#d4e4dc'], [.55, '#8fb3a0'], [1, '#4f6e60']]); s.fill();
      s.lineWidth = .15; s.strokeStyle = '#3a5246'; s.stroke();
    }
  }
  s.restore();
}

// ---------- a small hand-tied bunch, swaying ----------
const TIEY = -6;
function stemTo(hx, hy, col = '#3f8f4a', w = .55, bowK = 1) {
  const dx = -hx, dy = TIEY - hy, L = Math.hypot(dx, dy) || 1;
  let nx = -dy / L, ny = dx / L; if (nx * Math.sign(hx || 1) - ny * 1.5 < 0) { nx = -nx; ny = -ny; }
  const bow = Math.min(L * .1, 4) * bowK;
  s.beginPath(); s.moveTo(hx, hy);
  s.bezierCurveTo(hx + dx * .3 + nx * bow, hy + dy * .3 + ny * bow, dx * .08 + nx * bow * .4 + hx * .08, TIEY - L * .2, 0, TIEY);
  s.quadraticCurveTo(hx * .05, TIEY + 6, hx * .12, TIEY + 12);
  const g = s.createLinearGradient(hx, hy, 0, TIEY + 12);
  g.addColorStop(0, shade(col, .2)); g.addColorStop(.75, shade(col, -.35)); g.addColorStop(1, shade(col, -.15));
  s.strokeStyle = g; s.lineWidth = w; s.stroke();
}
function twine() {
  s.save(); s.translate(0, TIEY); s.rotate(.06);
  for (let k = -1; k <= 1; k++) { s.beginPath(); s.ellipse(0, k * 1.1, 3.4, .8, 0, 0, Math.PI); s.strokeStyle = '#b89a6a'; s.lineWidth = .5; s.stroke(); }
  s.restore();
}
// sway: rotate a head position around the tie; taller heads swing further and lag
function swayed(x, y, T, phase) {
  const h = Math.hypot(x, y - TIEY) / 60, th = .022 * Math.sin(T * .9 - h * 1.5 + phase) + .008 * Math.sin(T * 2.3 + phase);
  const dx = x, dy = y - TIEY, c = Math.cos(th), sn = Math.sin(th);
  return [dx * c - dy * sn, TIEY + dx * sn + dy * c, th];
}

  { name: 'carnations', meaning: 'admiration, a mother\'s love', colour: '#ff6a80', draw(T) {

// ---------- ASCII tiles ----------
const SS = 3, DPR = Math.min(3, devicePixelRatio || 1), BG = '#0b0a0d';
class Tile {
  constructor(def, i, host) {
    this.def = def;
    const card = document.createElement('figure'); card.className = 'tile';
    card.innerHTML = `<figcaption><span class="num">${String(i + 1).padStart(2, '0')}</span> <span style="color:${def.colour}">${def.name}</span><br><span class="mean">${def.meaning}</span></figcaption>`;
    this.c = document.createElement('canvas'); card.prepend(this.c); host.appendChild(card);
    this.x = this.c.getContext('2d');
    this.S = document.createElement('canvas'); this.s = this.S.getContext('2d', { willReadFrequently: true });
    this.size();
  }
  size() {
    const cs = getComputedStyle(this.c.parentElement), W = this.c.parentElement.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = Math.round(W * 1.05);
    const cols = Math.max(40, Math.round(W / 4.4)), cw = W / cols, fs = cw / .6, ch = fs, rows = Math.ceil(H / ch);
    Object.assign(this, { W, H, cols, rows, cw, ch, fs, k: Math.min(W / 60, H / 74), prev: null, hist: null });
    this.c.style.width = W + 'px'; this.c.style.height = H + 'px';
    this.c.width = Math.round(W * DPR); this.c.height = Math.round(H * DPR);
    const p = this.c.parentNode, n = this.c.nextSibling; p.removeChild(this.c); p.insertBefore(this.c, n);   // WebKit: fresh full-res layer
    this.S.width = cols * SS; this.S.height = rows * SS;
  }
  render(T) {
    const { W, H, cols, rows, cw, ch, fs, k, x } = this;
    s = this.s; s.setTransform(1, 0, 0, 1, 0, 0); s.clearRect(0, 0, this.S.width, this.S.height);
    s.setTransform(SS / cw, 0, 0, SS / ch, 0, 0); s.translate(W / 2, H * .93); s.scale(k, k);
    seed = 11; P = 1; this.def.draw(T); twine();
    const d = s.getImageData(0, 0, this.S.width, this.S.height).data, SW = this.S.width, N = cols * rows;
    const L = new Float32Array(N), R = new Float32Array(N), G = new Float32Array(N), B = new Float32Array(N), A = new Float32Array(N);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      let r = 0, g = 0, b = 0, a = 0;
      for (let dy = 0; dy < SS; dy++) for (let dx = 0; dx < SS; dx++) { const o = ((j * SS + dy) * SW + i * SS + dx) * 4, al = d[o + 3]; r += d[o] * al; g += d[o + 1] * al; b += d[o + 2] * al; a += al; }
      const kk = j * cols + i; A[kk] = a / (255 * SS * SS); if (a) { R[kk] = r / a; G[kk] = g / a; B[kk] = b / a; }
      L[kk] = (.3 * R[kk] + .59 * G[kk] + .11 * B[kk]) / 255 * A[kk];
    }
    if (this.prev && this.prev.L.length === N) {          // light temporal smoothing, as on the main page
      const p = this.prev;
      for (let kk = 0; kk < N; kk++) { L[kk] = p.L[kk] + (L[kk] - p.L[kk]) * .5; A[kk] = p.A[kk] + (A[kk] - p.A[kk]) * .5;
        if (A[kk] > .02 && p.A[kk] > .02) { R[kk] = p.R[kk] + (R[kk] - p.R[kk]) * .5; G[kk] = p.G[kk] + (G[kk] - p.G[kk]) * .5; B[kk] = p.B[kk] + (B[kk] - p.B[kk]) * .5; } }
    }
    this.prev = { L, R, G, B, A };
    if (!this.hist) this.hist = new Uint8Array(N);
    const hist = this.hist, at = (i, j) => (i < 0 || j < 0 || i >= cols || j >= rows) ? 0 : L[j * cols + i];
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = BG; x.fillRect(0, 0, this.c.width, this.c.height);
    x.font = `${fs < 9 ? 'bold ' : ''}${Math.round(fs * DPR * 10) / 10}px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace`; x.textBaseline = 'top';
    const buckets = new Map();
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const kk = j * cols + i;
      if (A[kk] < .06) { hist[kk] = 0; continue; }
      const l = Math.min(1, L[kk] * 1.35);
      const gx = (at(i + 1, j - 1) + 2 * at(i + 1, j) + at(i + 1, j + 1)) - (at(i - 1, j - 1) + 2 * at(i - 1, j) + at(i - 1, j + 1));
      const gy = ((at(i - 1, j + 1) + 2 * at(i, j + 1) + at(i + 1, j + 1)) - (at(i - 1, j - 1) + 2 * at(i, j - 1) + at(i + 1, j - 1))) * .5;
      let glyph, code; const was = hist[kk], mag = Math.hypot(gx, gy);
      if (l > .06 && mag > (was >= 1 && was <= 4 ? EDGE * .8 : EDGE * 1.1)) {
        const ang = (Math.atan2(gy, gx) + Math.PI) % Math.PI, fd = ang / (Math.PI / 4); let dir = Math.round(fd) % 4;
        if (was >= 1 && was <= 4) { const pd = was - 1, dist = Math.min(Math.abs(fd - pd), 4 - Math.abs(fd - pd)); if (dist < .75) dir = pd; }
        code = dir + 1; glyph = EDGES[dir];
      } else {
        if (l < (was ? .025 : .045)) { hist[kk] = 0; continue; }
        const fi = Math.pow(l, .8) * (RAMP.length - 1); let idx = Math.max(1, Math.min(RAMP.length - 1, Math.round(fi)));
        if (was >= 10 && Math.abs(fi - (was - 10)) < .8) idx = was - 10;
        code = idx + 10; glyph = RAMP[idx];
      }
      hist[kk] = code;
      const mx = Math.max(R[kk], G[kk], B[kk], 1), gain = Math.min(255 / mx, Math.max(1.25 + .6 * (1 - l), (95 + 160 * Math.sqrt(l)) / mx));
      const key = (Math.min(255, R[kk] * gain) >> 3) << 10 | (Math.min(255, G[kk] * gain) >> 3) << 5 | (Math.min(255, B[kk] * gain) >> 3);
      let bucket = buckets.get(key); if (!bucket) buckets.set(key, bucket = []);
      bucket.push(glyph, Math.round(i * cw * DPR), Math.round(j * ch * DPR));
    }
    for (const [key, bucket] of buckets) { x.fillStyle = `rgb(${(key >> 10) << 3},${(key >> 5 & 31) << 3},${(key & 31) << 3})`; for (let n = 0; n < bucket.length; n += 3) x.fillText(bucket[n], bucket[n + 1], bucket[n + 2]); }
  }
}

const host = document.getElementById('grid'), tiles = CATALOG.map((d, i) => new Tile(d, i, host));
const visible = new Set(), io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? visible.add(e.target) : visible.delete(e.target)));
tiles.forEach(t => io.observe(t.c));
addEventListener('resize', () => tiles.forEach(t => t.size()));
const t0 = performance.now(); let last = 0;
(function loop(now) {
  if (now - last > 33) { last = now; const T = (now - t0) / 1000; if (!still) for (const t of tiles) if (visible.has(t.c)) t.render(T); }   // ~30fps, only on-screen tiles
  requestAnimationFrame(loop);
})(t0);
if (still) tiles.forEach(t => t.render(5));
