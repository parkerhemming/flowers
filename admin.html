<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Flowers admin</title>
<meta name="theme-color" content="#0b0a0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='1' y='13' font-family='monospace' font-size='15' fill='%23e0314b'%3E@%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#0b0a0d;--ink:#e7dde1;--dim:#9d9096;--faint:#5a5258;--pink:#ffd6dc;--line:rgba(255,214,220,.28);--red:#ff5c6c;--green:#8fd38a}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent}
  main{max-width:900px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px 60px}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h1{font-size:16px;color:var(--pink);margin:0;flex:1;font-weight:600}
  button{font:inherit;color:var(--pink);background:none;border:0;padding:0 6px;min-height:44px;cursor:pointer}
  button.red{color:var(--red)}
  button.dim{color:var(--dim)}
  button:disabled{opacity:.4;cursor:default}
  h2{font-size:14px;color:var(--pink);margin:26px 0 8px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  h2::before{content:'// ';color:var(--dim)}
  h2 .grow{flex:1}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
  .stat{border:1px dashed var(--line);border-radius:3px;padding:8px 10px}
  .stat b{display:block;font-size:20px;color:var(--pink);font-weight:600}
  .stat span{color:var(--dim);font-size:12px}
  .prompt{display:flex;align-items:baseline;gap:1ch;border-bottom:1px dashed var(--line);min-height:44px;padding:6px 0;box-sizing:border-box}
  .prompt label{color:var(--pink);white-space:nowrap}
  .prompt input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:16px;caret-color:var(--pink)}
  .prompt input::placeholder{color:var(--faint)}
  .tools{display:flex;gap:4px;align-items:center;flex-wrap:wrap;color:var(--dim);font-size:12px}
  .tools label{display:flex;align-items:center;gap:6px;min-height:44px;cursor:pointer}
  .tools input[type=checkbox]{accent-color:#ffd6dc;width:16px;height:16px}
  .b{display:flex;gap:12px;border:1px dashed var(--line);border-radius:3px;padding:10px;margin-bottom:8px}
  .b.pending{opacity:.55}
  .b img{width:64px;height:64px;flex:none;border:1px dashed var(--line);border-radius:3px;background:var(--bg)}
  .b .body{flex:1;min-width:0}
  .b .who{color:var(--pink);font-weight:600}
  .b .who i{color:var(--dim);font-style:normal;font-weight:400}
  .b .meta{color:var(--dim);font-size:12px}
  .b a.link{color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--line);word-break:break-all}
  .b .flowers{font-size:12px;margin:2px 0}
  .b .notes{font-size:12px;color:var(--dim);margin:2px 0;overflow-wrap:anywhere}
  .b .acts{display:flex;flex-wrap:wrap;margin:2px -6px -8px}
  .tag{font-size:11px;padding:0 5px;border:1px solid var(--line);border-radius:3px;margin-left:4px;color:var(--dim);white-space:nowrap}
  .tag.paid{color:var(--green);border-color:rgba(143,211,138,.45)}
  .tag.code{color:#b79cff;border-color:rgba(183,156,255,.45)}
  .ok{color:var(--green)}
  .c{display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--line);min-height:44px;flex-wrap:wrap}
  .c code{color:var(--pink);font-size:15px}
  .c .meta{color:var(--dim);font-size:12px;flex:1}
  .c a{color:var(--ink)}
  .empty{color:var(--faint);padding:10px 0}
  #msg{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(11,10,13,.95);border:1px dashed var(--line);border-radius:3px;padding:8px 14px;color:var(--pink);font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  #msg.on{opacity:1}
  #login{max-width:420px;margin:18vh auto 0}
  #login p{color:var(--dim);font-size:12px}
  .err{color:var(--red);font-size:12px;min-height:1.5em}
</style>
<main>
  <div id="login" hidden>
    <h1>&gt; flowers admin</h1>
    <p>enter your admin key. it's saved on this device until you press [ lock ].</p>
    <div class="prompt"><label for="key">&gt; key:</label><input id="key" type="password" autocomplete="current-password" spellcheck="false"><button id="go">[ go ]</button></div>
    <p class="err" id="err"></p>
  </div>

  <div id="app" hidden>
    <div class="top"><h1>&gt; flowers admin</h1><button id="refresh">[ refresh ]</button><button class="dim" id="lock">[ lock ]</button></div>
    <div class="stats" id="stats"></div>

    <h2><span class="grow">bouquets</span></h2>
    <div class="prompt"><label for="q">&gt; find:</label><input id="q" placeholder="name, email, id, flower" autocomplete="off" spellcheck="false"></div>
    <div class="tools"><label><input type="checkbox" id="unpaid"> show unpaid checkouts</label></div>
    <div id="list"></div>

    <h2><span class="grow">free codes</span><button id="make1">[ + 1 ]</button><button id="make5">[ + 5 ]</button></h2>
    <div id="codes"></div>
  </div>
</main>
<div id="msg" role="status"></div>
<script src="flowers.js?v=1"></script>
<script>
// Private dashboard: everything comes from api/admin/*, which checks the key on every request.
const $ = id => document.getElementById(id);
const store = { get: () => { try { return localStorage.getItem('flowers-admin') || ''; } catch (e) { return ''; } },
  set: v => { try { v ? localStorage.setItem('flowers-admin', v) : localStorage.removeItem('flowers-admin'); } catch (e) {} } };
let key = store.get(), data = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = t => new Date(t * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const toast = t => { $('msg').textContent = t; $('msg').classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => $('msg').classList.remove('on'), 1800); };
const copy = async t => { try { await navigator.clipboard.writeText(t); toast('copied ✓'); } catch (e) { prompt('copy this', t); } };
async function api(path, body) {
  const r = await fetch('api/admin/' + path, { method: body ? 'POST' : 'GET', headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  if (r.status === 401) { lock('that key is wrong'); throw new Error('locked'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'something went wrong');
  return j;
}
function lock(why = '') { key = ''; store.set(''); $('app').hidden = true; $('login').hidden = false; $('err').textContent = why; $('key').value = ''; $('key').focus(); }
async function load() {
  try { data = await api('data'); } catch (e) { if (e.message !== 'locked') toast(e.message); return; }
  $('login').hidden = true; $('app').hidden = false; render();
}
$('go').onclick = () => { key = $('key').value.trim(); store.set(key); load(); };
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
$('lock').onclick = () => lock();
$('refresh').onclick = () => load().then(() => toast('up to date'));
$('q').addEventListener('input', render);
$('unpaid').addEventListener('change', render);

function render() {
  const all = data.bouquets, paid = all.filter(b => b.status === 'paid'), sold = paid.filter(b => b.via === 'stripe');
  const stats = [
    [sold.length, 'paid bouquets'],
    ['$' + (sold.length * data.price / 100).toFixed(2), 'revenue (before stripe fees)'],
    [paid.length - sold.length, 'free, from codes'],
    [data.codes.filter(c => !c.used_by).length, 'unused codes'],
    [paid.filter(b => b.mailed).length, 'emails sent'],
    [all.length - paid.length, 'unpaid checkouts'],
  ];
  $('stats').innerHTML = stats.map(([n, t]) => `<div class="stat"><b>${esc(n)}</b><span>${esc(t)}</span></div>`).join('');

  const q = $('q').value.trim().toLowerCase();
  const rows = all.filter(b => ($('unpaid').checked || b.status === 'paid') &&
    (!q || [b.id, b.name, b.from, b.email, b.f, ...b.msgs, ...b.f.split('.').map(k => BY_KEY[k.replace('*', '')]?.name)].join(' ').toLowerCase().includes(q)));
  $('list').innerHTML = rows.length ? rows.map(b => {
    const url = `https://hemm.ing/flowers/${b.id}`;
    const flowers = b.f.split('.').map(k => { const d = BY_KEY[k.replace('*', '')]; return d ? `<span style="color:${d.colour}">${esc(d.name)}</span>${k.endsWith('*') ? ' <span style="color:var(--pink)">&lt;3</span>' : ''}` : esc(k); }).join(', ');
    const via = b.via === 'stripe' ? '99¢' : b.via?.startsWith('code:') ? 'FLWR-' + b.via.slice(9) : esc(b.via);
    return `<div class="b ${b.status}">
      <img src="api/icon/${b.id}" alt="" loading="lazy">
      <div class="body">
        <div class="who">for ${esc(b.name.toLowerCase())}${b.from ? ` <i>from ${esc(b.from.toLowerCase())}</i>` : ''}
          <span class="tag ${b.status === 'paid' ? (b.via === 'stripe' ? 'paid' : 'code') : ''}">${b.status === 'paid' ? via : 'unpaid'}</span></div>
        ${b.status === 'paid' ? `<a class="link" href="${url}" target="_blank" rel="noopener">hemm.ing/flowers/${b.id}</a>` : `<span class="meta">${b.id} (link won't open until paid)</span>`}
        <div class="flowers">${flowers}</div>
        ${b.msgs.length ? `<div class="notes">notes: ${b.msgs.map(m => '"' + esc(m) + '"').join(' · ')}</div>` : ''}
        <div class="meta">${when(b.created)}${b.email ? ` · ${esc(b.email)} · ${b.mailed ? '<span class="ok">email sent ✓</span>' : 'email not sent'}` : ' · no buyer email'}</div>
        <div class="acts">
          ${b.status === 'paid' ? `<button data-copy="${url}">[ copy link ]</button><button data-open="${url}">[ open ]</button>` : ''}
          ${b.status === 'paid' && b.email ? `<button data-resend="${b.id}">[ resend email ]</button>` : ''}
          <button class="red" data-del="${b.id}" data-name="${esc(b.name)}">[ delete ]</button>
        </div>
      </div></div>`;
  }).join('') : `<div class="empty">${q ? 'nothing matches.' : 'no bouquets yet.'}</div>`;

  $('codes').innerHTML = data.codes.length ? data.codes.map(c => `<div class="c">
      <code>${esc(c.code)}</code>
      <span class="meta">${c.used_by ? `used ${when(c.used)} → <a href="https://hemm.ing/flowers/${esc(c.used_by)}" target="_blank" rel="noopener">${esc(c.used_by)}</a>` : `unused · made ${when(c.created)}`}</span>
      ${c.used_by ? '' : `<button data-copy="${esc(c.code)}">[ copy ]</button>`}
    </div>`).join('') : '<div class="empty">no codes yet. make some to give friends a free bouquet.</div>';
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.copy) return copy(b.dataset.copy);
  if (b.dataset.open) return open(b.dataset.open, '_blank', 'noopener');
  if (b.dataset.resend) { b.disabled = true; try { await api('resend', { id: b.dataset.resend }); toast('email on its way'); setTimeout(load, 4000); } catch (er) { toast(er.message); } b.disabled = false; return; }
  if (b.dataset.del) {
    if (!confirm(`Delete the bouquet for ${b.dataset.name} (${b.dataset.del})? Its link stops working. This can't be undone.`)) return;
    try { await api('delete', { ids: [b.dataset.del] }); toast('deleted'); load(); } catch (er) { toast(er.message); }
  }
});
for (const [id, n] of [['make1', 1], ['make5', 5]]) $(id).onclick = async () => {
  try { const r = await api('codes', { n }); await load(); copy(r.codes.join('\n')); toast(n === 1 ? 'made + copied ' + r.codes[0] : `made ${n} codes + copied`); } catch (e) { toast(e.message); }
};
key ? load() : lock();
</script>
</html>
