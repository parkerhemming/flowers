    font:13px/1.25 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:#ffd6dc;

<script>
// Flowers are drawn as shaded vector shapes to a hidden canvas each frame, then
// every cell of a dense monospace grid is sampled into a glyph + colour.
// Debug: ?bt=<seconds> freezes the bloom, ?m=0..1 freezes the morph, ?cols=N sets density.
// A short link (hemm.ing/flowers/k7x2p9) loads its saved bouquet first; everything below
// reads it exactly like a long ?name=&f= link. Synchronous on purpose: it's tiny, and the
// whole scene is built from it on the next line.
const q = (() => {
  const p = new URLSearchParams(location.search), id = location.pathname.match(/\/([a-hjkmnp-z2-9]{6})$/);
  if (!id) return p;
  let b = null;
  try { const r = new XMLHttpRequest(); r.open('GET', 'api/b/' + id[1], false); r.send(); if (r.status === 200) b = JSON.parse(r.responseText); } catch (e) {}
  if (!b || b.status !== 'paid') { location.replace('./'); throw new Error('no such bouquet'); }   // unknown or unpaid: off to make one
  window.BID = id[1]; window.BICON = b.icon;
  document.querySelector('link[rel=apple-touch-icon]').href = 'api/icon/' + id[1];   // its own home-screen icon
  p.set('name', b.name); if (b.from) p.set('from', b.from); p.set('f', b.f); b.msgs.forEach(m => p.append('msg', m));
  return p;
})();
if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.body.classList.add('app');
const c = document.getElementById('c'), x = c.getContext('2d');
const S = document.createElement('canvas'); s = S.getContext('2d', { willReadFrequently: true });

function fern(x0, y0, cx1, cy1, x1, y1, dark = .3) {
  const e = ease(P * 1.8); if (e <= 0) return;
  const pt = t => [(1 - t) ** 2 * x0 + 2 * (1 - t) * t * cx1 + t * t * x1, (1 - t) ** 2 * y0 + 2 * (1 - t) * t * cy1 + t * t * y1];
  s.beginPath(); for (let t = 0; t <= e; t += .02) s.lineTo(...pt(t));
  s.strokeStyle = shade('#2f6b35', -dark); s.lineWidth = .5; s.stroke();
  for (let t = .42; t < e; t += .028) {
    const [px, py] = pt(t), [qx, qy] = pt(t + .01), a = Math.atan2(qy - py, qx - px), L = Math.sin((t - .38) / .62 * Math.PI) * 5 + 1;
    for (const sd of [-1, 1]) {
      s.save(); s.translate(px, py); s.rotate(a + sd * 1.05);
      s.beginPath(); s.ellipse(L * .5, 0, L * .5, L * .16, 0, 0, TAU);
      s.fillStyle = shade(sd > 0 ? '#2f7a3b' : '#4f9a45', -dark + (t - .42) * .5); s.fill(); s.restore();
    }
  }
}
// ---------- scene ----------
// Every flower head is a physical "unit" with its own stem back to the tie point.
// For the name morph each unit travels to a spot on a hand-drawn stroke of the
// name; stems bend to follow, sprays and clusters stay connected, leaves ride
// along on their host stems. Nothing is redrawn as a font.
const TIE = [3, -34];
const smooth = t => { t = clamp01(t); return t * t * t * (t * (6 * t - 15) + 10); };   // smootherstep
let seed2 = 99;
const rnd2 = () => (seed2 = (seed2 * 16807) % 2147483647) / 2147483647;
const GREENS = ['#245228', '#2a5e30', '#3f8f4a', '#356f37', '#4f9a45', '#5a8a3a', '#62a84f'];
const stemProps = o => Object.assign(o, {
  bend: (rnd2() - .5) * 10, j1: (rnd2() - .5) * 4, j2: (rnd2() - .5) * 2.4,
  ex: TIE[0] + (rnd2() - .5) * 13, ey: -15 + rnd2() * 4, col: GREENS[rnd2() * 5 | 0], w: .45 + rnd2() * .3,
});
const units = [], clusters = [], sprays = [], leaves = [];
const addUnit = u => { stemProps(u); u.id = units.length; units.push(u); return u; };

// ---- the bouquet, composed from ?f= (e.g. rose.dokrak.orchid.babys*; * marks their favorite) ----
// Focal flowers fill a dome on a sunflower-seed spiral; filler goes into the gaps; small
// flowers are added until there are enough heads to spell a name clearly.
const PICKS = [];
for (const k of (q.get('f') || 'rose.dokrak.orchid.babys*').split('.')) {
  const key = k.replace('*', '');
  if (BY_KEY[key] && !PICKS.some(p => p.key === key) && PICKS.length < 5) PICKS.push({ key, fav: k.endsWith('*') && !PICKS.some(p => p.fav), d: BY_KEY[key] });
}
if (!PICKS.length) PICKS.push({ key: 'rose', fav: false, d: BY_KEY.rose });
const FOCAL = PICKS.filter(p => p.d.kind === 'focal'), FILL = PICKS.filter(p => p.d.kind === 'filler');
const CX = 3, CY = -88;                                   // dome centre; the tie is below it
const outward = (x, y) => Math.atan2(x - TIE[0], TIE[1] - y);
const heads = [];                                         // [x, y, r] of everything placed, for spacing
function single(p, hx, hy, r, z) {
  const u = addUnit({ type: 'head', key: p.key, hx, hy, r, z, v: heads.length, spike: !!p.d.spike,
    rot: p.d.spike ? 0 : ['tulip', 'calla', 'iris', 'lily'].includes(p.key) ? outward(hx, hy) * .5 : rnd2() * TAU,
    tilt: (hx - CX) / 50, sq: .75 + rnd2() * .2, open: .7 + rnd2() * .3 });
  heads.push([hx, hy, r]); return u;
}
function spray(hx, hy, z) {                               // an arching orchid spray ending near (hx, hy)
  const si = sprays.length, n = 6, r0 = BY_KEY.orchid.size, p0 = [TIE[0], TIE[1]];
  const p2 = [hx + (hx - CX) * .25, hy - 8], p1 = [(p0[0] + p2[0]) / 2 + (hx - CX) * .5, (p0[1] + p2[1]) / 2 - 14];
  sprays.push({ z });
  for (let i = 0; i < n; i++) {
    const t = .35 + .65 * i / (n - 1), side = i % 2 ? 1 : -1, w = 1 - t;
    const bx = w * w * p0[0] + 2 * w * t * p1[0] + t * t * p2[0], by = w * w * p0[1] + 2 * w * t * p1[1] + t * t * p2[1];
    addUnit({ type: i >= n - 2 ? 'obud' : 'orchid', hx: bx + side * 2.2, hy: by + 1, r: r0 * (1 - .14 * i), rot: side * .25 + rnd2() * .3 - .15, side, z: z + i * .01, sp: si, t });
    heads.push([bx, by, r0]);

}
function cluster(p, cx, cy, z) {                          // dok rak umbel or a cloud of baby's breath
  const ci = clusters.push(stemProps({ R: p.d.cluster === 'bb' ? 4 : p.d.size, z, kind: p.d.cluster })) - 1, R = p.d.size;
  if (p.d.cluster === 'dok') {
    const offs = [[0, 0], ...[0, 1, 2, 3, 4, 5].map(k => [Math.cos(k * 1.047 + rnd2() * .4), Math.sin(k * 1.047 + rnd2() * .4) * .85]), [-.6, -1.5], [.7, -1.45]];
    offs.forEach(([ox, oy], k) => addUnit({ type: k < 7 ? 'dok' : 'dokbud', hx: cx + ox * R * .78, hy: cy + oy * R * .78, r: k < 7 ? R * .5 : R * .32, rot: rnd2() * TAU, z: z + k * .01, cl: ci }));
  } else for (let k = 0; k < 8; k++) {
    const a = rnd2() * TAU, d = Math.sqrt(rnd2()) * R;
    addUnit({ type: 'bb', hx: cx + Math.cos(a) * d, hy: cy + Math.sin(a) * d * .8, r: 1.4 + rnd2() * .6, rot: rnd2() * TAU, z: z + k * .01, cl: ci });
  }
  heads.push([cx, cy, R]);
}
// somewhere in the dome not already covered (best of a few random tries)
function gap(rx, ry) {
  let best = null, bestD = -Infinity;                 // least-crowded spot, even when the dome is already full
  for (let k = 0; k < 24; k++) {
    const a = rnd2() * TAU, d = Math.sqrt(rnd2()), x = CX + Math.cos(a) * d * rx, y = CY + Math.sin(a) * d * ry;
    const free = Math.min(99, ...heads.map(([hx, hy, r]) => Math.hypot(x - hx, y - hy) - r * .8));
    if (free > bestD) { bestD = free; best = [x, y]; }
  }
  return best;
}
const zOf = y => 1 + (y - (CY - 34)) / 9;                 // lower in the dome = further forward
{
  // focal: a sunflower-seed spiral, types taking turns so they mix
  const nF = FOCAL.length ? (FILL.length ? 11 : 15) : 0, small = FILL.length ? 1 : .85;
  for (let i = 0; i < nF; i++) {
    const p = FOCAL[i % FOCAL.length], t = (i + .5) / nF, rr = Math.sqrt(t), a = i * 2.39996;
    const x = CX + Math.cos(a) * rr * 40, y = CY + Math.sin(a) * rr * 28;
    if (p.key === 'orchid') { if (sprays.length < 3) spray(x, y, zOf(y)); continue; }
    single(p, x, y, p.d.size * small * (.85 + .25 * rnd2()) * (1.12 - .25 * rr), zOf(y));
  }
  // filler into the gaps, a little wider than the focal dome
  const nFill = FILL.length ? Math.round(6 / FILL.length) + 1 : 0;
  for (const p of FILL) for (let i = 0; i < nFill; i++) {
    const [x, y] = gap(52, 38);
    if (p.d.cluster) cluster(p, x, y, zOf(y) - 1.5); else single(p, x, y, p.d.size * (.85 + .3 * rnd2()), zOf(y) - 1.5);
  }
  // enough heads to spell a name: top up with smaller ones of whatever was picked
  for (let i = 0; units.length < 34 && i < 40; i++) {
    const p = PICKS[i % PICKS.length], [x, y] = gap(54, 40);
    if (p.key === 'orchid') { if (sprays.length < 5) spray(x, y, zOf(y) - 2); continue; }
    if (p.d.cluster) cluster(p, x, y, zOf(y) - 2); else single(p, x, y, p.d.size * (p.d.kind === 'focal' ? .55 : .85) * (.85 + .3 * rnd2()), zOf(y) - 2);
  }
}

// leaves hang off the focal stems, so they travel with them
const HOSTS = units.filter(u => u.type === 'head' && !u.spike);
if (HOSTS.length) for (let i = 0; i < 10; i++)
  leaves.push({ host: HOSTS[rnd2() * HOSTS.length | 0], t: .18 + rnd2() * .35, a: (rnd2() - .5) * 2.2,
    len: 12 + rnd2() * 12, w: 3 + rnd2() * 2, z: rnd2() < .75 ? 2.5 + rnd2() * 3 : 7.5 + rnd2() });

// ---- the name, as loose single-line strokes ----
// A tiny hand-made font: cap height 10, x-height 6, baseline 0, y down. A one-point
// stroke is a dot (i, j) and gets exactly one flower: the biggest head.
const arc = (cx, cy, rx, ry, a0, a1) => { const out = [], n = Math.max(2, Math.ceil(Math.abs(a1 - a0) / 18));
  for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; out.push([cx + rx * Math.cos(a), cy - ry * Math.sin(a)]); } return out; };
const FONT = {
  A: [6, [[0, 0], [3, -10], [6, 0]], [[1.2, -4], [4.8, -4]]],
  B: [6, [[0, 0], [0, -10], [3, -10], ...arc(3, -7.5, 2.4, 2.5, 90, -90), [0, -5]], [[0, -5], [3.2, -5], ...arc(3.2, -2.5, 2.7, 2.5, 90, -90), [0, 0]]],
  C: [7, arc(4.6, -5, 4.6, 5, 50, 310)],
  D: [6.5, [[0, 0], [0, -10], [2.5, -10], ...arc(2.5, -5, 4, 5, 90, -90), [0, 0]]],
  E: [5, [[5, -10], [0, -10], [0, 0], [5, 0]], [[0, -5], [4, -5]]],
  F: [5, [[5, -10], [0, -10], [0, 0]], [[0, -5], [4, -5]]],
  G: [8, [...arc(4, -5, 4, 5, 50, 360), [5, -5]]],
  H: [6, [[0, 0], [0, -10]], [[6, 0], [6, -10]], [[0, -5], [6, -5]]],
  I: [0, [[0, 0], [0, -10]]],
  J: [4, [[4, -10], [4, -3], ...arc(2, -3, 2, 3, 0, -180)]],
  K: [6, [[0, 0], [0, -10]], [[5.5, -10], [0, -4]], [[1.8, -6], [5.8, 0]]],
  L: [5, [[0, -10], [0, 0], [5, 0]]],
  M: [8, [[0, 0], [0, -10], [4, -3], [8, -10], [8, 0]]],
  N: [6, [[0, 0], [0, -10], [6, 0], [6, -10]]],
  O: [9, arc(4.5, -5, 4.5, 5, 0, 360)],
  P: [6, [[0, 0], [0, -10], [3, -10], ...arc(3, -7.25, 2.75, 2.75, 90, -90), [0, -4.5]]],
  Q: [9, arc(4.5, -5, 4.5, 5, 0, 360), [[5.5, -2.5], [9, .5]]],
  R: [6, [[0, 0], [0, -10], [3, -10], ...arc(3, -7.25, 2.75, 2.75, 90, -90), [0, -4.5]], [[3, -4.5], [6, 0]]],
  S: [6, [...arc(3, -7.5, 3, 2.5, 30, 270), ...arc(3, -2.5, 3, 2.5, 90, -150)]],
  T: [7, [[0, -10], [7, -10]], [[3.5, -10], [3.5, 0]]],
  U: [6, [[0, -10], [0, -3.5], ...arc(3, -3.5, 3, 3.5, 180, 360), [6, -10]]],
  V: [6, [[0, -10], [3, 0], [6, -10]]],
  W: [9, [[0, -10], [2, 0], [4.5, -7], [7, 0], [9, -10]]],
  X: [6, [[0, -10], [6, 0]], [[6, -10], [0, 0]]],
  Y: [6, [[0, -10], [3, -5], [6, -10]], [[3, -5], [3, 0]]],
  Z: [6, [[0, -10], [6, -10], [0, 0], [6, 0]]],
  a: [7, arc(2.8, -3, 2.8, 3, 40, 322), [[5.6, -6], [5.7, -1.4], [6.2, -.1], [7, -.4]]],
  b: [5.6, [[0, -10], [0, 0]], arc(2.8, -3, 2.8, 3, 160, -160)],
  c: [5.5, arc(3, -3, 3, 3, 45, 315)],
  d: [5.6, arc(2.8, -3, 2.8, 3, 20, 340), [[5.6, -10], [5.6, 0]]],

    const paint = (text, [cr, cg, cb]) => `<span style="color:rgb(${cr},${cg},${cb});text-shadow:0 0 12px rgba(${cr},${cg},${cb},.4)">${text}</span>`;
    // Top/bottom bars take the colours of the text actually nearest each character: every
    // run of text pulls with its own colour (dimmed by any opacity, e.g. the Thai names),
    // weighted so the nearest line dominates; where that line ends, the bar falls through to
    // the next line's colours. Same idea as the sides, but across the bar.
    const left = info.getBoundingClientRect().left, cw2 = info.getBoundingClientRect().width / cols, segs = [];
    const BG = [11, 10, 13];
    const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      if (!n.textContent.trim()) continue;
      const el = n.parentElement; let o = 1;
      for (let e = el; e && e !== body; e = e.parentElement) o *= parseFloat(getComputedStyle(e).opacity);
      const c = rgb(el).map((v, i) => Math.round(v * o + BG[i] * (1 - o)));
      const rng = document.createRange(); rng.selectNodeContents(n);
      for (const r of rng.getClientRects()) if (r.width) segs.push([r.left - left, r.right - left, (r.top + r.bottom) / 2 - top, c]);
    }
    const mixAt = (x, y) => {
      let w = 0, acc = [0, 0, 0];
      for (const [x0, x1, ym, c] of segs) {
        const dx = x < x0 ? x0 - x : x > x1 ? x - x1 : 0;
        const k = Math.exp(-Math.abs(ym - y) / 26) * Math.exp(-dx / 14);   // nearest line leads, the next ones still mix in
        w += k; acc = acc.map((v, i) => v + c[i] * k);
      }
      return w ? acc.map(v => Math.round(v / w)) : [255, 214, 220];
    };
    // top bar from the text below it; the bottom bar is the same colours mirrored left-right
    const topColours = [...Array(cols)].map((_, i) => mixAt((i + .5) * cw2, .5 * lh));
    const barLine = (ends, colours) => [...ends[0] + '-'.repeat(cols - 2) + ends[1]].map((ch, i) => paint(ch, colours[i])).join('');
    const lines = [barLine('..', topColours)];
    for (let r = 1; r < rows - 1; r++) lines.push(paint(`|${' '.repeat(cols - 2)}|`, colourAt((r + .5) * lh)));
    lines.push(barLine("''", [...topColours].reverse()));
    infoFrame.innerHTML = lines.join('\n');
  }
  addEventListener('resize', () => { if (info.classList.contains('open')) fitInfo(); });
  const setInfo = open => { if (open) fitInfo(); info.classList.toggle('open', open); btn.setAttribute('aria-expanded', open); };
  btn.addEventListener('click', () => setInfo(!info.classList.contains('open')));
  // replay: back to an empty screen and the full bloom. The hint comes back only if
  // she hadn't tapped the flowers yet.
  const replay = document.getElementById('replay');
  replay.addEventListener('click', () => {
    hinted = hinted && !document.body.classList.contains('paused');
    // replay clears the hint quickly (tapping the flowers keeps the slower fade)
    hint.style.transition = 'opacity .2s ease, transform .2s ease'; setTimeout(() => hint.style.transition = '', 250);
    document.body.classList.remove('paused');
    setInfo(false);
    let next = orderIdx(noteCycle + 1);                 // whatever was due after the current message
    if (next === notePos) next = (next + 1) % ORDER.length;
    resume = next;
    dim = 1;
    t0 = start(); target = M = Mv = 0; lagged = false; drift = 1; windScale = 1; lastT = 0; shown = null;
    for (const u of units) u.mm = 0;
    prevL = null; hist = null;                          // no smoothing carried over from the old frame
  });
  // Home-screen app: iOS resumes it where it was left rather than reloading, so every
  // time it comes back on screen, start over with a fresh bloom (same as pressing replay)
  const replayIfApp = () => { if (document.body.classList.contains('app')) replay.click(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') replayIfApp(); });
  addEventListener('pageshow', e => { if (e.persisted) replayIfApp(); });
  addEventListener('pointerdown', e => {
    const el = e.target instanceof Node ? e.target : null;
    if (el && (btn.contains(el) || info.contains(el) || replay.contains(el) || editBtn.contains(el))) return;
    if (info.classList.contains('open')) { setInfo(false); return; }   // a tap outside just closes the panel
    // only a tap on the flowers (or on the hint) toggles; empty space does nothing
    if ((el && hint.contains(el)) || onFlowers(e.clientX, e.clientY, e.pointerType === 'mouse' ? 6 : 18)) toggle(now());
  });
  addEventListener('keydown', e => {
    if (e.key === 'Escape') return setInfo(false);
    if ((e.key === ' ' || e.key === 'Enter') && e.target === document.body) { e.preventDefault(); toggle(now()); }
  });
  (function loop() {
    const T = now(), dt = Math.min(.1, T - lastT); lastT = T;
    const typeAt = BLOOM_END - .6;                    // starts typing as the last flowers finish opening
    document.body.classList.toggle('bloomed', T > typeAt - .3);
    const [txt, busy] = noteAt(T - typeAt);
    if (txt !== shown) { shown = txt; typed.textContent = txt; }
    noteEl.classList.toggle('typing', busy);
    if (!hinted && T > BLOOM_END + HINT_AFTER) { hinted = true; document.body.classList.add('paused'); updateCursor(); }
    // the wind eases in as the last flowers open, and nearly stops while paused
    const paused = document.body.classList.contains('paused');
    windScale += ((paused ? .25 : 1) - windScale) * Math.min(1, dt * 1.5);
    dim += ((paused ? .42 : 1) - dim) * Math.min(1, dt * 3);   // the pause dims the flowers in-canvas
    stepMorph(dt);
    frame(M, calm ? 1e3 : T, calm ? 0 : smooth((T - 3.5) / 3) * windScale);
    if (mouse) updateCursor();                         // flowers can move under a resting cursor
    requestAnimationFrame(loop);
  })();
}
</script>
</html>
